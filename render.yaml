services:
  # FastAPI backend
  - type: web
    name: artefax-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7 # Render defaults to 3.14, which has no prebuilt
        # pydantic-core wheel yet — pip then tries to compile it from
        # source (Rust/maturin), which fails on Render's read-only build
        # filesystem. Pin to a version with a prebuilt wheel instead.
      - key: GEMINI_API_KEY
        sync: false # secret — set manually in the Render dashboard
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      - key: FRONTEND_URL
        fromService:
          type: web
          name: artefax
          property: host

  # Next.js frontend
  - type: web
    name: artefax
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: artefax-backend
          property: host
