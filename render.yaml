services:
  # FastAPI backend
  - type: web
    name: artefax-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7 # Render defaults to 3.14, which has no prebuilt
        # pydantic-core wheel yet — pip then tries to compile it from
        # source (Rust/maturin), which fails on Render's read-only build
        # filesystem. Pin to a version with a prebuilt wheel instead.
      - key: GEMINI_API_KEY
        sync: false # secret — set manually in the Render dashboard
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      - key: FRONTEND_URL
        sync: false # set manually — see note below
        # fromService's only URL-shaped property is "host", which
        # resolves to the service's PRIVATE-network hostname (just the
        # bare service name, e.g. "artefax") — not the public
        # onrender.com URL. That's useless here: CORS matches against
        # the real public Origin a browser sends, and Render doesn't
        # expose the public URL as a fromService property at all. So
        # this has to be set by hand once the frontend service exists:
        # https://artefax.onrender.com (or your custom domain, if any).

  # Next.js frontend
  - type: web
    name: artefax
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # set manually — same reason as FRONTEND_URL above:
        # https://artefax-backend.onrender.com (or your custom domain)
